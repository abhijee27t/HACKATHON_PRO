<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#05070f" />
  <title>Odisha — Games</title>
  <style>
    :root {
      --bg-0: #05070f;
      --neon: #22d3ee;
      --text: #e8eefc;
      --muted: #7c88a5;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; width: 100%;
      background: radial-gradient(circle at 50% 20%, #0d1730 0%, var(--bg-0) 70%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    main { text-align: center; padding: 24px; max-width: 560px; }
    .badge {
      display: inline-block; font-size: 11px; letter-spacing: 0.32em;
      text-transform: uppercase; color: var(--neon); margin-bottom: 12px;
    }
    h1 {
      font-size: clamp(30px, 9vw, 56px); margin: 0 0 12px; font-weight: 800;
      text-shadow: 0 0 24px rgba(34, 211, 238, 0.35);
    }
    p { color: var(--muted); font-size: 15px; line-height: 1.6; margin: 0 auto 28px; max-width: 40ch; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 14px; margin-bottom: 28px;
    }
    .card {
      border: 1px solid rgba(34,211,238,0.25); border-radius: 16px;
      background: rgba(34,211,238,0.05); padding: 22px 16px;
      box-shadow: 0 0 22px rgba(34,211,238,0.1);
    }
    .card strong { display: block; font-size: 16px; margin-bottom: 4px; }
    .card small { color: var(--muted); }
    a.card {
  display: block;
  color: inherit;
  text-decoration: none;
  cursor: pointer;
  transition: 0.25s;
}

a.card:hover {
  transform: translateY(-5px);
  border-color: rgba(34,211,238,0.8);
  box-shadow: 0 0 30px rgba(34,211,238,0.25);
}
    a.back {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 22px; border-radius: 999px;
      border: 1px solid rgba(34,211,238,0.5);
      color: var(--text); text-decoration: none; font-weight: 600; font-size: 14px;
      background: rgba(34,211,238,0.08);
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">Bharat Quest</span>
    <h1>Welcome to Odisha</h1>
    <p>You unlocked the region. Choose a game below to begin your quest.</p>
    <div class="grid">
     <a class="card" href="konark.html">
    <strong>Echoes of Konark</strong>
    <small>Explore • Discover • Restore</small>
</a>
      <div class="card"><strong>Puri Puzzle</strong><small>Coming soon</small></div>
      <div class="card"><strong>Chilika Dash</strong><small>Coming soon</small></div>
    </div>
    <a class="back" href="index.html">&larr; Back to map</a>
  </main>
</body>
</html>
